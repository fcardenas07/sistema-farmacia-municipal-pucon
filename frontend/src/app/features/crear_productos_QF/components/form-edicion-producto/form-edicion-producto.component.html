<div class="form-container" *ngIf="!cargando; else loading">
  <div class="form-grid">
    <!-- NOMBRE COMERCIAL -->
    <div class="form-group">
      <label>Nombre comercial</label>
      <input
        type="text"
        [(ngModel)]="form.nombreComercial"
        (ngModelChange)="validate()"
        [class.error]="errors.nombreComercial"
      />
      <p class="error-msg" *ngIf="errors.nombreComercial">
        {{ errors.nombreComercial }}
      </p>
    </div>

    <!-- NOMBRE GENERICO -->
    <div class="form-group">
      <label>Nombre genérico</label>
      <input
        type="text"
        [(ngModel)]="form.nombreGenerico"
        (ngModelChange)="validate()"
        [class.error]="errors.nombreGenerico"
      />
      <p class="error-msg" *ngIf="errors.nombreGenerico">
        {{ errors.nombreGenerico }}
      </p>
    </div>

    <!-- PRESENTACION -->
    <div class="form-group full">
      <label>Presentación</label>
      <input type="text" [(ngModel)]="form.presentacion" />
    </div>

    <!-- DOSIFICACION -->
    <div class="form-group full">
      <label>Dosificación</label>
      <div class="dosificacion-row">
        <input
          type="number"
          [(ngModel)]="form.dosificacion"
          (ngModelChange)="validate()"
          [class.error]="errors.dosificacion"
        />

        <select [(ngModel)]="form.unidadMedida">
          <option value="mg">mg</option>
          <option value="ml">ml</option>
          <option value="mcg">mcg</option>
          <option value="g">g</option>
        </select>
      </div>

      <p class="error-msg" *ngIf="errors.dosificacion">
        {{ errors.dosificacion }}
      </p>
    </div>

    <!-- STOCK MINIMO -->
    <!-- <div class="form-group">
      <label>Stock mínimo</label>
      <input
        type="number"

      />
      <p class="error-msg" *ngIf="errors.stockMinimo">
        {{ errors.stockMinimo }}
      </p>
    </div> -->

        [class.error]="errors.stockMaximo"
      />
      <p class="error-msg" *ngIf="errors.stockMaximo">
        {{ errors.stockMaximo }}
      </p>
    </div> -->

    <!-- CATEGORIA -->
    <!-- <div class="form-group full">
      <label>Categoría</label>
      <select [(ngModel)]="form.categoria">
        <option value="ANALGESICOS_ANTIINFLAMATORIOS">
          Analgésicos / Antiinflamatorios
        </option>
      </select>
    </div> -->

    <!-- FABRICANTE -->
    <!-- <div class="form-group full">
      <label>ID del fabricante (opcional)</label>
      <input type="text" [(ngModel)]="form.idFabricante" />
    </div> -->
  </div>

  <!-- BOTONES -->
  <div class="buttons">
    <button class="continue-btn" (click)="guardar()" [disabled]="!isValid">
      Guardar cambios
    </button>
  </div>
</div>

<ng-template #loading>
  <p>Cargando producto...</p>
</ng-template>
