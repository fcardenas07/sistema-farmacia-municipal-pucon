<div class="form-container">

  <div class="form-grid">

    <!-- NOMBRE COMERCIAL -->
    <div class="form-group">
      <label>Nombre comercial</label>
      <input 
        type="text" 
        [(ngModel)]="form.nombreComercial"
        (ngModelChange)="validate()"
        [class.error]="errors.nombreComercial"
      >
      <p class="error-msg" *ngIf="errors.nombreComercial">
        {{ errors.nombreComercial }}
      </p>
    </div>

    <!-- NOMBRE GENERICO -->
    <div class="form-group">
      <label>Nombre genérico</label>
      <input 
        type="text" 
        [(ngModel)]="form.nombreGenerico"
        (ngModelChange)="validate()"
        [class.error]="errors.nombreGenerico"
      >
      <p class="error-msg" *ngIf="errors.nombreGenerico">
        {{ errors.nombreGenerico }}
      </p>
    </div>

    <!-- PRESENTACION -->
    <div class="form-group full">
      <label>Presentación</label>
      <input 
        type="text" 
        [(ngModel)]="form.presentacion"
        (ngModelChange)="validate()"
      >
    </div>

    <!-- DOSIFICACION -->
    <div class="form-group full">
      <label>Dosificación</label>
      <div class="dosificacion-row">
        <input 
          type="number"
          [(ngModel)]="form.dosificacion"
          placeholder="Cantidad"
          (ngModelChange)="validate()"
          [class.error]="errors.dosificacion"
        />

        <select 
          [(ngModel)]="form.unidadMedida"
          (ngModelChange)="validate()"
        >
          <option value="mg">mg</option>
          <option value="ml">ml</option>
          <option value="mcg">mcg</option>
          <option value="g">g</option>
        </select>
      </div>

      <p class="error-msg" *ngIf="errors.dosificacion">
        {{ errors.dosificacion }}
      </p>
    </div>

    <!-- STOCK MINIMO -->
    <div class="form-group">
      <label>Stock mínimo</label>
      <input 
        type="number" 
        [(ngModel)]="form.stockMinimo"
        (ngModelChange)="validate()"
        [class.error]="errors.stockMinimo"
      >
      <p class="error-msg" *ngIf="errors.stockMinimo">
        {{ errors.stockMinimo }}
      </p>
    </div>

    <!-- STOCK MAXIMO -->
    <div class="form-group">
      <label>Stock máximo</label>
      <input 
        type="number" 
        [(ngModel)]="form.stockMaximo"
        (ngModelChange)="validate()"
        [class.error]="errors.stockMaximo"
      >
      <p class="error-msg" *ngIf="errors.stockMaximo">
        {{ errors.stockMaximo }}
      </p>
    </div>

    <!-- CATEGORIA -->
    <div class="form-group full">
      <label>Categoría</label>
      <select 
        [(ngModel)]="form.categoria"
        (ngModelChange)="validate()"
      >
        <option value="ANALGESICOS_ANTIINFLAMATORIOS">
          Analgésicos / Antiinflamatorios
        </option>
      </select>
    </div>

    <!-- FABRICANTE -->
    <div class="form-group full">
    <label>ID del fabricante (opcional)</label>
    <input type="text" [(ngModel)]="form.idFabricante">
  </div>


  </div>

  <!-- BOTONES -->
  <div class="buttons">
    <button class="clear-btn" (click)="vaciarFormulario()">Vaciar formulario</button>

    <button 
      class="continue-btn" 
      (click)="continuar()"
      [disabled]="!isValid"
    >
      Continuar
    </button>
  </div>

</div>
